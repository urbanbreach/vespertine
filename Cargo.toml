[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.dev.package.vespertine_macros]
opt-level = 3

[profile.dev.package.vespertine_derive_refineable]
opt-level = 3

[profile.dev.package.vespertine_util_macros]
opt-level = 3

[profile.dev.package.quote]
opt-level = 3

[profile.dev.package.syn]
opt-level = 3

[profile.dev.package.proc-macro2]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.vespertine_collections]
codegen-units = 1

[profile.dev.package.vespertine_refineable]
codegen-units = 1

[profile.dev.package.vespertine_reqwest_client]
codegen-units = 1

[profile.dbg]
inherits = "dev"
debug = "full"

[profile.dbg.build-override]
debug = "full"

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

[profile.release.package]

[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16
