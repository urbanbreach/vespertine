[workspace]
resolver = "2"
members = [
    "crates/vespertine",
    "crates/vespertine_apple",
    "crates/vespertine_bench_metrics",
    "crates/vespertine_collections",
    "crates/vespertine_derive_refineable",
    "crates/vespertine_http_client",
    "crates/vespertine_http_client_tls",
    "crates/vespertine_linux",
    "crates/vespertine_macos",
    "crates/vespertine_macros",
    "crates/vespertine_path",
    "crates/vespertine_perf",
    "crates/vespertine_platform",
    "crates/vespertine_refineable",
    "crates/vespertine_reqwest_client",
    "crates/vespertine_scheduler",
    "crates/vespertine_shared_string",
    "crates/vespertine_sum_tree",
    "crates/vespertine_tokio",
    "crates/vespertine_util",
    "crates/vespertine_util_core",
    "crates/vespertine_util_macros",
    "crates/vespertine_wgpu",
    "crates/vespertine_windows",
    "crates/vespertine_zlog",
    "crates/vespertine_ztracing",
    "crates/vespertine_ztracing_macro",
]

[workspace.package]
publish = false
edition = "2024"

