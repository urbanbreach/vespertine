[package]
edition = "2024"
rust-version = "1.95"
name = "merman-core"
version = "0.8.0-alpha.5"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Mermaid parser + semantic model (headless; parity-focused)."
homepage = "https://github.com/Latias94/merman"
documentation = "https://docs.rs/merman-core"
readme = "README.md"
keywords = [
    "mermaid",
    "diagrams",
    "parser",
    "ast",
]
categories = [
    "parser-implementations",
    "visualization",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/merman"
resolver = "2"

[package.metadata.merman]
artifact-profile-required = true

[features]
default = []
system-clock = []
system-random = [
    "dep:getrandom",
    "getrandom/std",
]
system-timezone = [
    "dep:jiff",
    "dep:sha2",
    "jiff/std",
    "jiff/tz-system",
    "jiff/tz-fat",
    "jiff/tzdb-bundle-platform",
    "jiff/tzdb-zoneinfo",
    "jiff/tzdb-concatenated",
    "jiff/perf-inline",
]
system-timing = ["dep:web-time"]

[lib]
name = "merman_core"
path = "src/lib.rs"

[[test]]
name = "editor_lexemes"
path = "tests/editor_lexemes.rs"

[[test]]
name = "editor_lexemes_architecture"
path = "tests/editor_lexemes_architecture.rs"

[[test]]
name = "editor_lexemes_langium_basic"
path = "tests/editor_lexemes_langium_basic.rs"

[[test]]
name = "editor_lexemes_langium_structured"
path = "tests/editor_lexemes_langium_structured.rs"

[[test]]
name = "editor_lexemes_line_parsers"
path = "tests/editor_lexemes_line_parsers.rs"

[[test]]
name = "jison_accessibility_parity"
path = "tests/jison_accessibility_parity.rs"

[[test]]
name = "nesting_depth_limits"
path = "tests/nesting_depth_limits.rs"

[[test]]
name = "snapshots"
path = "tests/snapshots.rs"

[[test]]
name = "time_domain"
path = "tests/time_domain.rs"

[[test]]
name = "zenuml_grammar_test"
path = "tests/zenuml_grammar_test.rs"

[dependencies.euclid]
version = "0.22.14"

[dependencies.getrandom]
version = "0.4"
optional = true
default-features = false

[dependencies.granit-parser]
version = "=1.0.0"
features = ["error_messages"]
default-features = false

[dependencies.htmlize]
version = "1.1.0"
features = ["unescape"]

[dependencies.indexmap]
version = "2.2.6"
features = ["serde"]

[dependencies.jiff]
version = "0.2.34"
optional = true
default-features = false

[dependencies.json5]
version = "1.3.1"

[dependencies.lalrpop-util]
version = "0.23.1"
default-features = false

[dependencies.rustc-hash]
version = "2.1.1"

[dependencies.ryu-js]
version = "1.0.2"

[dependencies.serde]
version = "1.0.217"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.150"
features = ["preserve_order"]

[dependencies.sha2]
version = "0.10.9"
optional = true

[dependencies.thiserror]
version = "2.0.11"

[dependencies.unicode-general-category]
version = "1.1.0"

[dependencies.url]
version = "2.5.4"

[dependencies.web-time]
version = "1.1.0"
optional = true

[dev-dependencies.futures]
version = "0.3.31"
features = ["executor"]
default-features = false

[dev-dependencies.regex]
version = "1.11.1"
