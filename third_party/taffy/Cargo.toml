# Vendored copy of taffy 0.13.0 (MIT, https://github.com/DioxusLabs/taffy) with a
# key-matched nine-entry measurement cache (LAY-001 R4). See src/tree/cache.rs.

[package]
edition = "2021"
rust-version = "1.71"
name = "taffy"
version = "0.13.0"
authors = [
    "Alice Cecile <alice.i.cecile@gmail.com>",
    "Johnathan Kelley <jkelleyrtp@gmail.com>",
    "Nico Burns <nico@nicoburns.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A flexible UI layout library "
keywords = [
    "cross-platform",
    "layout",
    "flexbox",
    "css-grid",
    "grid",
]
categories = ["gui"]
license = "MIT"
repository = "https://github.com/DioxusLabs/taffy"

[features]
alloc = ["serde?/alloc"]
block_layout = []
calc = []
content_size = []
debug = ["std"]
default = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "float_layout",
    "calc",
    "content_size",
    "detailed_layout_info",
]
detailed_layout_info = []
flexbox = []
float_layout = []
grid = [
    "alloc",
    "dep:smallvec",
]
parse = ["dep:cssparser"]
parse_faster = [
    "parse",
    "cssparser/fast_match_byte",
]
profile = ["std"]
serde = ["dep:serde"]
std = [
    "serde?/std",
    "slotmap?/std",
]
strict_provenance = []
taffy_tree = ["dep:slotmap"]

[lib]
name = "taffy"
path = "src/lib.rs"

[dependencies.arrayvec]
version = "0.7"
default-features = false

[dependencies.cssparser]
version = "0.37.0"
optional = true
default-features = false

[dependencies.document-features]
version = "0.2.7"
optional = true

[dependencies.serde]
version = "1.0"
features = ["serde_derive"]
optional = true
default-features = false

[dependencies.slotmap]
version = "1.0.6"
optional = true
default-features = false

[dependencies.smallvec]
version = "1.13"
optional = true
default-features = false

