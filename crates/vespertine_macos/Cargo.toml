[package]
name = "vespertine_macos"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/vespertine_macos.rs"
doctest = false

[features]
default = ["vespertine/default"]
bench-support = ["vespertine/bench-support", "vespertine_apple/bench-support"]
test-support = ["vespertine/test-support", "vespertine_apple/test-support"]
runtime_shaders = ["vespertine_apple/runtime_shaders"]
font-kit = ["vespertine_apple/font-kit"]
screen-capture = ["vespertine/screen-capture", "dep:objc2-core-graphics", "dep:objc2-core-media", "dep:objc2-screen-capture-kit"]

[dependencies]
vespertine.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit.workspace = true
accesskit_macos.workspace = true
anyhow.workspace = true
block2.workspace = true
cocoa.workspace = true
vespertine_collections.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
ctor.workspace = true
dispatch2 = { workspace = true, features = ["block2", "objc2"] }
foreign-types.workspace = true
futures.workspace = true
vespertine_apple.workspace = true
vespertine_util.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
objc.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics = { workspace = true, optional = true }
objc2-core-media = { workspace = true, optional = true }
objc2-core-video = { workspace = true, features = ["CVHostTime"] }
objc2-foundation.workspace = true
objc2-screen-capture-kit = { workspace = true, optional = true }
objc2-user-notifications.workspace = true
parking_lot.workspace = true
raw-window-handle.workspace = true
vespertine_scheduler.workspace = true
semver.workspace = true
smallvec.workspace = true
strum.workspace = true
uuid.workspace = true

# The macOS test-only window implementation depends on test-only APIs from both
# VESPERTINE and the extracted renderer. A dependency does not inherit this crate's
# `cfg(test)`, so dev-dependencies enable those APIs only for test builds.
[target.'cfg(target_os = "macos")'.dev-dependencies]
vespertine = { workspace = true, features = ["test-support"] }
vespertine_apple = { workspace = true, features = ["test-support"] }
