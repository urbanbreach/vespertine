[package]
name = "vespertine_wgpu"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/vespertine_wgpu.rs"
doctest = false

[features]
default = []
bench-support = ["vespertine/bench-support", "dep:image"]
font-kit = ["dep:font-kit"]
test-support = ["vespertine/test-support", "dep:image"]

[dependencies]
vespertine.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
vespertine_collections.workspace = true
cosmic-text = "0.19.0"
etagere.workspace = true
itertools.workspace = true
image = { workspace = true, optional = true }
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
swash.workspace = true
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
vespertine_util.workspace = true

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { workspace = true, features = ["std", "metal", "gles", "vulkan", "wgsl"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
wgpu = { workspace = true, features = ["std", "dx12", "metal", "gles", "vulkan", "wgsl"] }

[dev-dependencies]
criterion.workspace = true
vespertine = { workspace = true, features = ["bench-support", "test-support"] }
image.workspace = true
# Integration tests (tests/headless_device.rs) use the headless renderer, which exists only with `test-support`.
vespertine_wgpu = { workspace = true, features = ["test-support"] }
vespertine_bench_metrics.workspace = true
# Validate shaders with the same Naga revision that wgpu uses at runtime.
naga = { git = "https://github.com/gfx-rs/wgpu", rev = "3b3506ea31154edc04de64debda0e780cba2639c", features = ["wgsl-in"] }

[[bench]]
name = "layout_line"
harness = false

[[example]]
name = "edge_fade"
path = "examples/edge_fade.rs"
required-features = ["test-support"]

[[example]]
name = "edge_fade_checkerboard"
path = "examples/edge_fade_checkerboard.rs"
required-features = ["test-support"]

[[bench]]
name = "curved_clip"
harness = false
required-features = ["bench-support", "test-support"]

[[example]]
name = "glyph_transform"
path = "examples/glyph_transform.rs"
required-features = ["test-support"]
