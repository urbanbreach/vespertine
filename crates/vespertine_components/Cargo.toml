[package]
name = "vespertine_components"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Reusable components built from elements: the embedded browser surface (CMP-022)"

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
accesskit.workspace = true
vespertine.workspace = true
vespertine_richtext.workspace = true
vespertine_theme.workspace = true
vespertine_webview.workspace = true
thiserror.workspace = true
image.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
ttf-parser.workspace = true
pulldown-cmark.workspace = true
merman.workspace = true
url.workspace = true
usvg.workspace = true
alacritty_terminal.workspace = true

[dev-dependencies]
image.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tempfile.workspace = true
vespertine = { workspace = true, features = ["font-kit", "wayland", "x11", "test-support"] }
vespertine_platform = { workspace = true, features = ["wayland", "x11"] }
vespertine_test_host = { path = "../vespertine_test_host" }
vespertine_webview.workspace = true
vespertine_test_host.workspace = true

[[example]]
name = "browser_surface"
path = "examples/browser_surface.rs"

[[example]]
name = "chart_gallery"
path = "examples/chart_gallery.rs"

[[example]]
name = "audio_activity"
path = "examples/audio_activity.rs"

[[example]]
name = "media_viewer"
path = "examples/media_viewer.rs"

[[example]]
name = "terminal_surface"
path = "examples/terminal_surface.rs"

[[example]]
name = "scrollbars"
path = "examples/scrollbars.rs"

[[example]]
name = "elastic_scroll"
path = "examples/elastic_scroll.rs"

[[example]]
name = "streaming_list"
path = "examples/streaming_list.rs"
