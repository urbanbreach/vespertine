[package]
name = "vespertine_components"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Reusable components built from elements: the embedded browser surface (CMP-022)"

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
bytemuck.workspace = true
anyhow.workspace = true
accesskit.workspace = true
vespertine.workspace = true
vespertine_richtext.workspace = true
vespertine_theme.workspace = true
vespertine_webview.workspace = true
thiserror.workspace = true
image.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
ttf-parser.workspace = true
pulldown-cmark.workspace = true
merman.workspace = true
url.workspace = true
usvg.workspace = true
alacritty_terminal.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { workspace = true, features = ["std", "metal", "gles", "vulkan", "wgsl", "glsl", "naga-ir"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
wgpu = { workspace = true, features = ["std", "dx12", "metal", "gles", "vulkan", "wgsl", "glsl", "naga-ir"] }

[dev-dependencies]
image.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tempfile.workspace = true
vespertine = { workspace = true, features = ["font-kit", "wayland", "x11", "test-support"] }
vespertine_platform = { workspace = true, features = ["wayland", "x11"] }
vespertine_test_host = { path = "../vespertine_test_host" }
vespertine_webview.workspace = true

