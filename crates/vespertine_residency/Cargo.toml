[package]
name = "vespertine_residency"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Incremental block documents, bounded derived-result caches, media residency budgets and identity-checked asynchronous publication"

[lints]
workspace = true

[lib]
path = "src/vespertine_residency.rs"
doctest = false

[dependencies]
vespertine.workspace = true

[dev-dependencies]
image.workspace = true
smallvec.workspace = true
vespertine = { workspace = true, features = ["test-support"] }
vespertine_richtext.workspace = true
vespertine_platform = { workspace = true, features = ["font-kit", "wayland", "x11", "test-support"] }
vespertine_wgpu = { workspace = true, features = ["test-support"] }

[[example]]
name = "stream_document"
path = "examples/stream_document.rs"
