setTimeout(function(){
  navigator.geolocation.getCurrentPosition(function(){window.geo='granted'},function(e){window.geo='denied:'+e.code});
  Notification.requestPermission().then(function(p){window.notif=p});
  navigator.mediaDevices&&navigator.mediaDevices.getUserMedia({video:true}).then(function(){window.media='granted'},function(e){window.media='denied:'+e.name});
},100);
