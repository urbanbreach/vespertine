<!doctype html>
<html><head><meta charset="utf-8"><title>Anim fixture</title>
<style>html,body{margin:0;background:#fff}
#a{position:absolute;left:0;top:0;width:50px;height:50px;background:#f00}
#b{position:absolute;left:300px;top:200px;width:50px;height:50px;background:#00f}</style></head>
<body><div id="a"></div><div id="b"></div>
<script>window.flip=function(id,c){document.getElementById(id).style.background=c};</script>
</body></html>
