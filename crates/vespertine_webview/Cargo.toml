[package]
name = "vespertine_webview"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Embedded web view for Linux: helper-process protocol, lifecycle, pixel transfer and compositing"

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "vsp-synthetic-helper"
path = "src/bin/vsp-synthetic-helper.rs"

[dependencies]
vespertine.workspace = true
vespertine_wgpu.workspace = true
libc.workspace = true
serde_json.workspace = true
sha2.workspace = true
log.workspace = true
parking_lot.workspace = true
async-channel = { workspace = true, features = ["std"] }
url.workspace = true

[dev-dependencies]
futures.workspace = true
image.workspace = true
vespertine_wgpu = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
vespertine = { workspace = true, features = ["font-kit", "wayland", "x11", "test-support"] }
vespertine_platform = { workspace = true, features = ["wayland", "x11"] }
