[package]
name = "vespertine_test_host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Production-path offscreen visual test host and application automation for Vespertine"

[lints]
workspace = true

[lib]
path = "src/vespertine_test_host.rs"
doctest = false

[[bin]]
name = "vespertine_automation_fixture"
path = "src/bin/automation_fixture.rs"
required-features = ["offscreen"]

[features]
default = ["offscreen"]
# The offscreen window and the in-process automation backend over it. They need the test
# platform and the offscreen GPU renderer; without this feature the crate only provides the
# automation protocol, client and server plus the retained-host types a live application serves.
offscreen = [
    "vespertine/test-support",
    "dep:vespertine_platform",
    "vespertine_platform/test-support",
    "dep:vespertine_wgpu",
    "vespertine_wgpu/test-support",
]
# Exposes the frame-overlay controls of the host (requires the profiler build of vespertine).
profiler = ["vespertine/profiler"]

[dependencies]
# Not referenced by name: enables accesskit's serde feature, which serializing TreeUpdate needs.
accesskit = { workspace = true, features = ["serde"] }
anyhow.workspace = true
image.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
ttf-parser = "0.25"
vespertine.workspace = true
vespertine_platform = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
vespertine_wgpu = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# The frame-overlay tests need the profiler build of the host under plain `cargo test`.
vespertine_test_host = { path = ".", features = ["profiler"] }
