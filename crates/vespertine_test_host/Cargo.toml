[package]
name = "vespertine_test_host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Production-path offscreen visual test host and application automation for Vespertine"

[lints]
workspace = true

[lib]
path = "src/vespertine_test_host.rs"
doctest = false

[[bin]]
name = "vespertine_automation_fixture"
path = "src/bin/automation_fixture.rs"

[features]
default = []
# Exposes the frame-overlay controls of the host (requires the profiler build of vespertine).
profiler = ["vespertine/profiler"]

[dependencies]
# Not referenced by name: enables accesskit's serde feature, which serializing TreeUpdate needs.
accesskit = { workspace = true, features = ["serde"] }
anyhow.workspace = true
image.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
ttf-parser = "0.25"
vespertine = { workspace = true, features = ["test-support"] }
vespertine_platform = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
vespertine_wgpu = { workspace = true, features = ["test-support"] }

[dev-dependencies]
tempfile.workspace = true
# The frame-overlay tests need the profiler build of the host under plain `cargo test`.
vespertine_test_host = { path = ".", features = ["profiler"] }
