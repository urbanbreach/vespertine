[package]
name = "vespertine_macros"
version.workspace = true
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Macros used by vespertine"

[lints]
workspace = true

[features]
inspector = []

[lib]
path = "src/vespertine_macros.rs"
proc-macro = true
doctest = true
test = false

[dependencies]
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, default-features = true, features = ["full", "extra-traits", "visit-mut"] }

[dev-dependencies]
vespertine = { workspace = true, features = ["inspector"] }
