[package]
name = "vespertine_js_node"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Node-API addon exposing the Vespertine JavaScript host to Bun and Node"

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]
# The addon links against symbols supplied by the JavaScript runtime that loads it, so it has
# no test harness; its behavior is verified through the JavaScript package tests.
test = false
doctest = false

[features]
# Exports the offscreen `TestRenderer` / `testHostAvailable` behind the JavaScript test helpers
# (`@vespertine/host/testing`). It builds the test platform and the offscreen GPU renderer into
# the addon, so production addons leave it off; the package test scripts and
# `build-native.mjs --test-host` turn it on.
offscreen = ["vespertine_test_host/offscreen"]

[dependencies]
vespertine_js.workspace = true
vespertine_test_host = { path = "../vespertine_test_host", default-features = false }
vespertine_http_client.workspace = true
vespertine_reqwest_client.workspace = true
vespertine_updater.workspace = true
napi = { version = "3", features = ["napi9", "serde-json", "async"] }
napi-derive = "3"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
