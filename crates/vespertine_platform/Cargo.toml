[package]
name = "vespertine_platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/vespertine_platform.rs"
doctest = false

[features]
default = []
bench-support = ["vespertine/bench-support", "vespertine_macos/bench-support", "vespertine_wgpu/bench-support"]
font-kit = ["vespertine_macos/font-kit"]
inspector = ["vespertine/inspector"]
test-support = ["vespertine/test-support", "vespertine_macos/test-support", "vespertine_windows/test-support", "vespertine_wgpu/test-support"]
screen-capture = ["vespertine/screen-capture", "vespertine_macos/screen-capture", "vespertine_windows/screen-capture", "vespertine_linux/screen-capture"]
runtime_shaders = ["vespertine_macos/runtime_shaders"]
wayland = ["vespertine_linux/wayland"]
x11 = ["vespertine_linux/x11"]

[[bench]]
name = "focus_cleanup"
path = "../vespertine/benches/focus_cleanup.rs"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "inspector_render"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "randomized_element_tree"
harness = false
required-features = ["bench-support"]

[dependencies]
anyhow.workspace = true
vespertine.workspace = true
vespertine_reqwest_client.workspace = true

[dev-dependencies]
vespertine_bench_metrics.workspace = true
criterion.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
vespertine_macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
vespertine_windows.workspace = true
vespertine = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
vespertine_linux.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
vespertine_wgpu = { workspace = true, optional = true }

