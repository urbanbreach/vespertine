[package]
name = "vespertine_scenes"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "vsp-scene-runner"
path = "src/bin/vsp-scene-runner.rs"

[features]
# Sampling CPU profiler for the Vespertine runner (see README, "Profiling").
profile = ["dep:pprof", "dep:backtrace"]

[dependencies]
backtrace = { version = "0.3", optional = true }
pprof = { version = "0.15", optional = true, default-features = false, features = ["huge-depth"] }
vespertine = { workspace = true, features = ["font-kit", "wayland", "x11"] }
vespertine_platform = { workspace = true, features = ["wayland", "x11"] }
vespertine_wgpu.workspace = true
vespertine_richtext.workspace = true
vespertine_components.workspace = true
vespertine_theme.workspace = true
serde_json.workspace = true
inventory.workspace = true
libc.workspace = true

[dev-dependencies]
vespertine = { workspace = true, features = ["test-support"] }
